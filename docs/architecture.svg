<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-label="Five-layer enterprise data intelligence architecture"><rect width="900" height="530" rx="24" fill="#0c1526"/><text x="450" y="49" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="26" fill="#fff">Enterprise Operations Intelligence Lab</text><text x="450" y="77" text-anchor="middle" font-family="Arial" font-size="14" fill="#9eacc7">INDEPENDENT DEMO — SYNTHETIC DATA ONLY</text><g font-family="Arial" font-size="18" text-anchor="middle" fill="#fff"><rect x="170" y="103" width="560" height="65" rx="10" fill="#3153ad"/><text x="450" y="130" font-weight="bold">5 — Document retrieval &amp; optional LLM</text><text x="450" y="152" font-size="13">Source-cited local snippets; external inference disabled by default</text><rect x="170" y="183" width="560" height="65" rx="10" fill="#34649d"/><text x="450" y="210" font-weight="bold">4 — Workflow automation</text><text x="450" y="232" font-size="13">Idempotent alerts for human review only</text><rect x="170" y="263" width="560" height="65" rx="10" fill="#287c88"/><text x="450" y="290" font-weight="bold">3 — Business analytics and visualisation</text><text x="450" y="312" font-size="13">FastAPI, KPIs and browser dashboard</text><rect x="170" y="343" width="560" height="65" rx="10" fill="#317d69"/><text x="450" y="370" font-weight="bold">2 — Unified reporting dataset</text><text x="450" y="392" font-size="13">SQLite dimensional reporting, fanout-safe aggregations</text><rect x="170" y="423" width="560" height="65" rx="10" fill="#6b7650"/><text x="450" y="450" font-weight="bold">1 — Ingestion and semantic integration</text><text x="450" y="472" font-size="13">Synthetic CRM / tickets / billing CSVs, validation and quarantine</text></g></svg>